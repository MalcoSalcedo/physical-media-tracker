[project]
name = "physical-media-tracker"
version = "0.1.0"
description = "Raspberry Pi box that catalogs physical media and tracks what's currently playing via audio fingerprinting."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "requests>=2.32",
    "pyacoustid>=1.3",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sounddevice>=0.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    # DTZ: this project deliberately uses naive-but-UTC datetimes throughout
    # (to match SQLite's datetime('now'), which has no timezone info at all -
    # see listener.py), not timezone-aware ones. See ADR/DEVLOG history for
    # the timezone bug this consistency was specifically added to prevent.
    "DTZ",
    # BLE001: listener.py's main loop intentionally catches a bare Exception
    # so a single transient failure (network, mic, etc.) doesn't kill the
    # daemon - see the comment at that call site.
    "BLE001",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["app"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
